name: Lab Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify lab
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: cloud-operations-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate shell script syntax
        run: |
          bash -n scripts/diagnose.sh
          bash -n tests/test_shutdown.sh
          bash -n tests/test_recovery.sh

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the environment
        run: docker compose up -d --build --wait --wait-timeout 60

      - name: Run HTTP smoke tests
        run: python3 tests/http_smoke.py

      - name: Validate JSON access logs
        run: python3 tests/test_access_logs.py

      - name: Test backend outage and recovery
        run: bash tests/test_recovery.sh

      - name: Run environment diagnostics
        run: bash scripts/diagnose.sh

      - name: Test container shutdown
        run: bash tests/test_shutdown.sh

      - name: Show container status and logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 100

      - name: Clean up the environment
        if: always()
        run: docker compose down --remove-orphans
