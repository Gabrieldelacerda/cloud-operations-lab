name: Lab Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify lab
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: cloud-operations-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate shell script syntax
        run: |
          bash -n scripts/diagnose.sh
          bash -n tests/test_shutdown.sh
          bash -n tests/test_recovery.sh
          bash -n tests/test_diagnostics.sh
          bash -n tests/test_slow_backend.sh

      - name: Test request ID lookup
        run: python3 tests/test_find_request.py

      - name: Test proxy log summaries
        run: python3 tests/test_summarize_proxy_logs.py

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the environment
        run: docker compose up -d --build --wait --wait-timeout 60

      - name: Verify live request lookup
        run: python3 tests/test_live_request_lookup.py

      - name: Run HTTP smoke tests
        run: python3 tests/http_smoke.py

      - name: Validate JSON access logs
        run: python3 tests/test_access_logs.py

      - name: Test backend outage and recovery
        run: bash tests/test_recovery.sh

      - name: Test diagnostic failure detection
        run: bash tests/test_diagnostics.sh

      - name: Run environment diagnostics
        run: bash scripts/diagnose.sh

      - name: Test container shutdown
        run: bash tests/test_shutdown.sh

      - name: Test slow backend read timeout
        run: |
          set -o pipefail
          mkdir -p artifacts
          bash tests/test_slow_backend.sh 2>&1 | tee artifacts/slow-backend.log

      - name: Capture healthcheck history
        if: always()
        run: |
          mkdir -p artifacts
          python3 scripts/health_snapshot.py > artifacts/health-status.json
          cat artifacts/health-status.json

      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps -a | tee artifacts/container-status.txt
          docker compose logs --no-color --tail 100 2>&1 | tee artifacts/compose.log

      - name: Summarize proxy responses
        if: ${{ always() && hashFiles('artifacts/compose.log') != '' }}
        run: |
          python3 scripts/summarize_proxy_logs.py < artifacts/compose.log > artifacts/proxy-summary.json

      - name: Show proxy diagnostics in the run summary
        if: ${{ always() && hashFiles('artifacts/proxy-summary.json') != '' }}
        run: |
          python3 - <<'SUMMARY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/proxy-summary.json").read_text())
          timing = report["request_time_seconds"]
          print("## Nginx responses in collected logs")
          print()
          print(f"- Requests captured: {report['requests']}")
          for status, count in report["statuses"].items():
              print(f"- HTTP {status}: {count}")
          if timing["samples"]:
              print(f"- p95 request time: {timing['p95']:.3f} s")
              print(f"- Maximum request time: {timing['max']:.3f} s")
              print(f"- Requests with timing data: {timing['samples']}")
          filtered = report["excluding_health"]
          filtered_timing = filtered["request_time_seconds"]
          print()
          print("### Requests excluding /health")
          print()
          print(f"- Requests captured: {filtered['requests']}")
          print(f"- Requests with timing data: {filtered_timing['samples']}")
          if filtered_timing["samples"]:
              print(f"- p95 request time: {filtered_timing['p95']:.3f} s")
              print(f"- Maximum request time: {filtered_timing['max']:.3f} s")
          else:
              print("- No request timing data in this sample.")
          SUMMARY

      - name: Upload container diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error

      - name: Clean up the environment
        if: always()
        run: docker compose down --remove-orphans
